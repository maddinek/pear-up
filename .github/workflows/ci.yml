name: CI

# The checks themselves live in tests/lib/check-*-here.sh, which run against
# whatever GNOME is on the machine they are invoked on. Locally that machine is a
# container started by tests/run-*.sh; here it is the job container. One
# implementation either way, so a check cannot pass in CI and fail on a desktop.
#
# The integration suite is deliberately absent. It boots systemd inside a
# privileged container to get logind, which needs podman's --systemd=always, and
# a runner is the wrong place to discover that has broken. Run it locally:
#   tests/integration/run.sh [version]

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Script units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash tests/check-uninstall.sh
      - run: bash tests/check-dock-script.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  schemas:
    name: Schemas compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin
      - run: glib-compile-schemas --strict --dry-run schemas/

  api:
    name: APIs on GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gnome: 45, image: 'fedora:39'}
          - {gnome: 46, image: 'fedora:40'}
          - {gnome: 47, image: 'fedora:41'}
          - {gnome: 48, image: 'fedora:42'}
          - {gnome: 49, image: 'fedora:43'}
          - {gnome: 50, image: 'fedora:44'}
    steps:
      # Before checkout: a bare Fedora image has neither, and the action needs
      # them to fetch the tree.
      - run: dnf install -q -y git tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash tests/lib/check-apis-here.sh "$PWD"

  prefs:
    name: Preferences on GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gnome: 45, image: 'fedora:39'}
          - {gnome: 46, image: 'fedora:40'}
          - {gnome: 47, image: 'fedora:41'}
          - {gnome: 48, image: 'fedora:42'}
          - {gnome: 49, image: 'fedora:43'}
          - {gnome: 50, image: 'fedora:44'}
    steps:
      - run: dnf install -q -y git tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: bash tests/lib/check-prefs-here.sh "$PWD"
