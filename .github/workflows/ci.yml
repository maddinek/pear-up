name: CI

# What runs here is what runs locally: the same scripts, told to use docker
# because that is what a runner has. Nothing is duplicated in YAML, so a check
# cannot pass in CI and fail on a desktop.
#
# The integration suite is deliberately absent. It boots systemd inside a
# privileged container to get logind, which needs podman's --systemd=always, and
# a runner is the wrong place to discover that has broken. Run it locally:
#   tests/integration/run.sh [version]

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  schemas:
    name: Schemas compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glib tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin
      - name: Compile the settings schemas
        run: glib-compile-schemas --strict --dry-run schemas/

  api:
    name: APIs exist on GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnome: [45, 46, 47, 48, 49, 50]
    steps:
      - uses: actions/checkout@v4
      - name: Check the API manifest against that release
        run: CONTAINER_RUNTIME=docker bash tests/run-api-matrix.sh ${{ matrix.gnome }}

  prefs:
    name: Preferences build on GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnome: [45, 46, 47, 48, 49, 50]
    steps:
      - uses: actions/checkout@v4
      - name: Open every preferences page headlessly
        run: CONTAINER_RUNTIME=docker bash tests/run-prefs-smoke.sh ${{ matrix.gnome }}
